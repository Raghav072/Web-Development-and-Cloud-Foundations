<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

<h2>Ordered List</h2>

<ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
    <li>Python</li>
</ol>


<h2>Unordered List</h2>

<ul>
    <li>Apple</li>
    <li>Mango</li>
    <li>Banana</li>
    <li>Orange</li>
</ul>


<h2>Description List</h2>

<dl>
    <dt><b>HTML</b></dt>
    <dd>HyperText Markup Language</dd>

    <dt><b>CSS</b></dt>
    <dd>Cascading Style Sheets</dd>

    <dt><b>JS</b></dt>
    <dd>JavaScript</dd>
</dl>

</body>
</html>
