<!DOCTYPE html>
<html>
<head>
    <title>CSS Font and Background Demo</title>

    <link rel="stylesheet" href="style4.css">
</head>

<body>

    <h1>Welcome to My Web Page</h1>

    <h2>Different Font Styles</h2>

    <p class="normal">
        This paragraph uses a normal font style.
    </p>

    <p class="italic">
        This paragraph uses an italic font style.
    </p>

    <p class="bold">
        This paragraph uses a bold font style.
    </p>

    <p id="special">
        This paragraph uses a special font, color and size.
    </p>

    <div class="box">
        <h2>Background Image of an Element</h2>
        <p>
            This box has its own background image.
        </p>
    </div>

</body>
</html>
